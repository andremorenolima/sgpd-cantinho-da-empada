<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPD - Cantinho da Empada & Café</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Cantinho da Empada & Café — SGPD</h1>
        <nav>
            <a href="{{ url_for('balcao') }}" class="btn" style="background:#a0522d; margin-right: 0.5rem;">Novo Balcão</a>
            <a href="{{ url_for('cozinha') }}" class="btn" style="background:#a0522d;">Painel Cozinha</a>
        </nav>
    </header>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
