{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="margin-top:0; color: var(--primary);">Acesso ao Sistema</h2>
    <form method="POST">
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required placeholder="Ex: gerente.cantinho">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required placeholder="********">
        </div>
        <button type="submit" style="width: 100%;">Entrar</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.9rem; color: #666; text-align: center;">Credencial padrão: <code>gerente.cantinho</code> / <code>senha123</code></p>
</div>
{% endblock %}
